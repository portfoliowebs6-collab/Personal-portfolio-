<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <meta
    name="theme-color"
    content="#070b14"
  >

  <title>Admin Login | KewaDev</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       ADMIN LOGIN
       ===================================================== -->

  <main class="login-page">

    <section
      class="login-card"
      aria-labelledby="loginTitle"
    >

      <!-- Logo -->
      <div
        class="login-logo"
        aria-hidden="true"
      >
        KD
      </div>

      <!-- Heading -->
      <h1 id="loginTitle">
        Admin Panel
      </h1>

      <p class="login-subtitle">
        Secure access to your KewaDev portfolio
      </p>

      <!-- Login Form -->
      <form
        id="loginForm"
        autocomplete="on"
        novalidate
      >

        <!-- Password -->
        <div class="form-group">

          <label for="adminPassword">
            Admin Password
          </label>

          <div class="input-wrapper">

            <input
              type="password"
              id="adminPassword"
              name="password"
              class="form-control"
              placeholder="Enter your password"
              autocomplete="current-password"
              minlength="1"
              required
            >

            <button
              type="button"
              id="togglePassword"
              class="toggle-password"
              aria-label="Show password"
              title="Show password"
            >
              👁️
            </button>

          </div>

        </div>

        <!-- Login Message -->
        <div
          id="loginMessage"
          class="login-message"
          hidden
          role="alert"
          aria-live="polite"
        ></div>

        <!-- Login Button -->
        <button
          type="submit"
          id="loginButton"
          class="btn btn-primary btn-full"
        >
          Login
        </button>

      </form>

      <!-- Security Note -->
      <div
        style="
          margin-top: 22px;
          padding-top: 16px;
          border-top: 1px solid rgba(255,255,255,0.07);
          text-align: center;
        "
      >
        <small
          style="
            color: #6f7c91;
            font-size: 10px;
          "
        >
          🔒 Protected Admin Area
        </small>
      </div>

    </section>

  </main>

  <!-- =====================================================
       API CONFIG
       =====================================================

       IMPORTANT:
       Replace the URL below with your deployed backend URL.

       Example:
       https://your-backend.onrender.com

       If frontend and backend are on the same domain,
       use an empty string: ""
       ===================================================== -->

  <script>
    window.API_BASE_URL = "https://deepak-portfolio-api.onrender.com";
  </script>

  <!-- Admin Login Script -->
  <script src="script.js"></script>

</body>
</html>
