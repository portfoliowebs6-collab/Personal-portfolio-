<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Deepak Kewat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#050811] text-gray-100 flex items-center justify-center h-screen px-6">
    <div class="bg-[#0f172a] border border-gray-800 p-8 rounded-3xl w-full max-w-md shadow-2xl">
        <h2 class="text-xl font-bold mb-2 text-center">Admin Portal</h2>
        <p class="text-gray-400 text-xs text-center mb-6">Enter your credentials to manage portfolio</p>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-[11px] font-medium text-gray-400 mb-1">Email</label>
                <input type="email" id="login-email" required class="w-full px-4 py-2.5 bg-gray-900 border border-gray-800 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-[11px] font-medium text-gray-400 mb-1">Password</label>
                <input type="password" id="login-password" required class="w-full px-4 py-2.5 bg-gray-900 border border-gray-800 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 font-semibold text-xs rounded-xl shadow-lg transition">Login</button>
            <p id="login-error" class="text-[11px] text-red-400 text-center hidden"></p>
        </form>
    </div>

    <script>
        const BACKEND_URL = 'https://personal-portfolio-8tbs.onrender.com/pi'; // Live par Render URL daal dena

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorTag = document.getElementById('login-error');

            try {
                const res = await fetch(`${BACKEND_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('adminToken', data.token);
                    window.location.href = 'admin.html';
                } else {
                    errorTag.textContent = data.message || 'Invalid credentials';
                    errorTag.classList.remove('hidden');
                }
            } catch (err) {
                errorTag.textContent = 'Server error. Try again later.';
                errorTag.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
