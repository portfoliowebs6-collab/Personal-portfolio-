<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Deepak Kewat — AI-Assisted Web Developer, Designer and Creative Mind."
  >

  <meta
    name="keywords"
    content="Deepak Kewat, AI Web Developer, Web Designer, JavaScript, Firebase, Portfolio"
  >

  <meta name="author" content="Deepak Kewat">

  <meta name="theme-color" content="#050816">

  <meta
    name="robots"
    content="index, follow"
  >

  <title>Deepak Kewat | AI-Assisted Web Developer</title>

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Google Font -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/jpeg"
    href="assets/images/profile.jpg"
  >

  <!--
    Backend API
    IMPORTANT:
    Deploy backend first and replace this URL
    with your real backend URL.
  -->
  <script>
    window.API_BASE_URL = "https://deepak-portfolio-api.onrender.com";
  </script>
</head>

<body>

  <!-- Background effects -->
  <div class="page-background" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-one"></div>
    <div class="bg-glow bg-glow-two"></div>
  </div>

  <!-- Navbar -->
  <div id="navbar"></div>

  <!-- Main Website -->
  <main id="main-content">

    <!-- Hero Section -->
    <section
      id="hero"
      class="portfolio-section"
      aria-label="Hero section"
    ></section>

    <!-- About Section -->
    <section
      id="about"
      class="portfolio-section"
      aria-label="About me"
    ></section>

    <!-- Skills Section -->
    <section
      id="skills"
      class="portfolio-section"
      aria-label="Skills"
    ></section>

    <!-- Projects Section -->
    <section
      id="projects"
      class="portfolio-section"
      aria-label="Projects"
    ></section>

    <!-- Contact Section -->
    <section
      id="contact"
      class="portfolio-section"
      aria-label="Contact"
    ></section>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-container">

      <div class="footer-brand">
        <span class="footer-logo">Kewa<span>Dev</span></span>

        <p>
          AI-Assisted Web Developer • Designer • Creative Mind
        </p>
      </div>

      <div class="footer-links">
        <a href="#hero">Home</a>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </div>

      <div class="footer-bottom">
        <p>
          © <span id="currentYear"></span> Deepak Kewat.
          All rights reserved.
        </p>
      </div>

    </div>
  </footer>

  <!-- Loading screen -->
  <div
    id="portfolioLoader"
    class="portfolio-loader"
    aria-hidden="true"
  >
    <div class="loader-content">
      <div class="loader-logo">Kewa<span>Dev</span></div>
      <div class="loader-spinner"></div>
      <p>Loading portfolio...</p>
    </div>
  </div>

  <!-- Main JavaScript -->
  <script type="module" src="script.js"></script>

  <!-- Small global utilities -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const yearElement =
        document.getElementById("currentYear");

      if (yearElement) {
        yearElement.textContent =
          new Date().getFullYear();
      }

      /*
        Hide loader after portfolio components
        have had time to render.
      */
      setTimeout(() => {
        const loader =
          document.getElementById("portfolioLoader");

        if (loader) {
          loader.classList.add("hidden");

          setTimeout(() => {
            loader.remove();
          }, 500);
        }
      }, 700);

    });
  </script>

</body>
</html>
